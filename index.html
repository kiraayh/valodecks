<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SITE CONTROL — a Valorant card game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0F0C;
    --panel: #121A16;
    --panel-2: #182019;
    --line: #26332B;
    --text: #E8E6DE;
    --muted: #6B7570;
    --p1: #FF6B35;
    --p1-dim: #6B3018;
    --p2: #3ED6B8;
    --p2-dim: #1E5C50;
    --warn: #FFD166;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }
  .display { font-family: 'Black Ops One', sans-serif; letter-spacing: 0.02em; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  #app { max-width: 1100px; margin: 0 auto; padding: 16px 16px 40px; }

  /* ---- Header ---- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0; border-bottom: 1px solid var(--line); margin-bottom: 18px;
    flex-wrap: wrap; gap: 10px;
  }
  header .title { font-size: 1.5rem; }
  header .title .accent { color: var(--p1); }
  .round-badge {
    font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 0.85rem;
    color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase;
  }
  .round-badge b { color: var(--text); }

  .cred-row { display: flex; gap: 18px; }
  .cred-chip {
    font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 0.85rem;
    padding: 6px 12px; border: 1px solid var(--line); display: flex; align-items: center; gap: 6px;
  }
  .cred-chip.p1 { border-color: var(--p1); color: var(--p1); }
  .cred-chip.p2 { border-color: var(--p2); color: var(--p2); }
  .cred-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

  /* ---- Sites board ---- */
  #sites { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
  .site {
    background: var(--panel); border: 1px solid var(--line); min-height: 260px;
    display: flex; flex-direction: column; position: relative; overflow: hidden;
  }
  .site.locked { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; }
  .site-head {
    padding: 10px 12px; border-bottom: 1px solid var(--line);
    background: var(--panel-2);
  }
  .site-head .name { font-family: 'Black Ops One', sans-serif; font-size: 1rem; color: var(--warn); }
  .site-head .effect { font-size: 0.7rem; color: var(--muted); margin-top: 2px; line-height: 1.3; }
  .site-body { flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .lane-row { display: flex; flex-direction: column; gap: 6px; min-height: 60px; }
  .lane-label { font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; }
  .lane-label.p1 { color: var(--p1); }
  .lane-label.p2 { color: var(--p2); }
  .mini-cards { display: flex; flex-wrap: wrap; gap: 4px; }
  .mini-card {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; font-weight: 600;
    padding: 3px 6px; border: 1px solid; white-space: nowrap;
  }
  .mini-card.p1 { border-color: var(--p1); color: var(--p1); }
  .mini-card.p2 { border-color: var(--p2); color: var(--p2); }
  .clickable-chip { cursor: pointer; border-style: dashed; transition: background-color 120ms ease; }
  .clickable-chip:hover { background-color: rgba(255,209,102,0.12); border-color: var(--warn); color: var(--warn); }
  .site-foot {
    padding: 8px 12px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-weight: 700;
  }
  .power-tally.p1 { color: var(--p1); }
  .power-tally.p2 { color: var(--p2); }
  .site.won-p1 { box-shadow: inset 0 0 0 2px var(--p1); }
  .site.won-p2 { box-shadow: inset 0 0 0 2px var(--p2); }
  .plant-pulse {
    position: absolute; inset: 0; pointer-events: none;
    animation: pulse 0.9s ease-out;
  }
  .plant-pulse.p1 { box-shadow: inset 0 0 40px var(--p1); }
  .plant-pulse.p2 { box-shadow: inset 0 0 40px var(--p2); }
  @keyframes pulse { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }

  /* ---- Turn banner ---- */
  #turn-banner {
    text-align: center; padding: 10px; margin-bottom: 14px;
    border: 1px solid var(--line); background: var(--panel);
    font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; letter-spacing: 0.05em;
  }
  #turn-banner.p1 { border-color: var(--p1); color: var(--p1); }
  #turn-banner.p2 { border-color: var(--p2); color: var(--p2); }

  /* ---- Start screen ---- */
  #start-overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 90;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px; padding: 20px;
  }

  /* ---- Pass screen ---- */
  #pass-overlay {
    position: fixed; inset: 0; background: rgba(5,8,6,0.97); z-index: 50;
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 18px;
  }
  #pass-overlay .display { font-size: 1.8rem; }
  #pass-overlay button { margin-top: 6px; }

  /* ---- Hand ---- */
  #hand-panel { background: var(--panel); border: 1px solid var(--line); padding: 14px; }
  #hand-panel .label { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
  #hand { display: flex; gap: 10px; flex-wrap: wrap; }
  .card {
    width: 128px; background: var(--panel-2); border: 1px solid var(--line);
    padding: 8px; cursor: pointer; transition: transform 120ms ease, border-color 120ms ease;
    display: flex; flex-direction: column; gap: 6px;
  }
  .card:hover { transform: translateY(-4px); }
  .card.selected { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn); }
  .card.unaffordable { opacity: 0.4; cursor: not-allowed; }
  .card .card-top { display: flex; justify-content: space-between; align-items: center; }
  .card .cost { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 0.85rem; color: var(--warn); }
  .card .role { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .card .name { font-family: 'Black Ops One', sans-serif; font-size: 0.85rem; line-height: 1.15; }
  .card .power { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 1.1rem; }
  .card .ability { font-size: 0.62rem; color: var(--muted); line-height: 1.25; min-height: 30px; }

  /* ---- Actions ---- */
  #actions { display: flex; gap: 10px; margin-top: 14px; justify-content: flex-end; }
  button {
    font-family: 'IBM Plex Mono', monospace; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    background: transparent; color: var(--text); border: 1px solid var(--line);
    padding: 10px 18px; cursor: pointer; font-size: 0.8rem; transition: all 120ms ease;
  }
  button:hover:not(:disabled) { border-color: var(--warn); color: var(--warn); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.primary { border-color: var(--p1); color: var(--p1); }
  button.primary:hover:not(:disabled) { background: rgba(255,107,53,0.1); }

  /* ---- Log ---- */
  #log { margin-top: 14px; background: var(--panel); border: 1px solid var(--line); padding: 12px; max-height: 140px; overflow-y: auto; }
  #log .label { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  #log-entries { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; line-height: 1.6; color: var(--muted); }
  #log-entries b { color: var(--text); }

  /* ---- Choice modal (for movement abilities) ---- */
  /* ---- Event toast — pops up for reveals/abilities, in addition to the log ---- */
  #event-toast {
    position: fixed; top: 110px; left: 50%;
    transform: translateX(-50%) translateY(-16px);
    background: var(--panel); border: 2px solid var(--warn);
    padding: 12px 22px; max-width: min(520px, 90vw);
    font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; text-align: center; line-height: 1.4;
    opacity: 0; z-index: 80; pointer-events: none;
    transition: opacity 180ms ease, transform 180ms ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  #event-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #event-toast b { color: var(--text); }

  #choice-overlay {
    position: fixed; inset: 0; background: rgba(5,8,6,0.9); z-index: 60;
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  }
  #choice-overlay .box { background: var(--panel); border: 1px solid var(--warn); padding: 24px; text-align: center; max-width: 380px; }
  #choice-overlay .prompt { font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; margin-bottom: 14px; }
  #choice-buttons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  /* ---- Game over ---- */
  #gameover-overlay {
    position: fixed; inset: 0; background: rgba(5,8,6,0.97); z-index: 70;
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; text-align: center; padding: 20px;
  }
  #gameover-overlay .result { font-size: 2rem; }
  #gameover-overlay .breakdown { font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; color: var(--muted); }

  @media (max-width: 720px) {
    #sites { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="title display">SITE <span class="accent">CONTROL</span></div>
    <div class="round-badge">ROUND <b id="round-num">1</b> / 6</div>
    <div class="cred-row">
      <div class="cred-chip p1"><span class="dot"></span><span id="p1-cred">0</span> CRED — P1</div>
      <div class="cred-chip p2"><span class="dot"></span><span id="p2-cred">0</span> CRED — P2</div>
    </div>
  </header>

  <div id="turn-banner"></div>

  <div id="sites"></div>

  <div id="hand-panel">
    <div class="label" id="hand-label">YOUR HAND</div>
    <div id="hand"></div>
  </div>

  <div id="actions">
    <button id="btn-clear">Clear Selection</button>
    <button id="btn-done" class="primary">Done Placing — Pass Device</button>
  </div>

  <div id="log">
    <div class="label">MATCH LOG</div>
    <div id="log-entries"></div>
  </div>
</div>

<div id="start-overlay">
  <div class="display" style="font-size:2.2rem;">SITE <span style="color:var(--p1);">CONTROL</span></div>
  <div class="mono" style="color:var(--muted); max-width:380px; text-align:center; font-size:0.8rem;">
    A Valorant-inspired tactical card game. Win 2 of 3 Sites by Power over 6 rounds.
  </div>
  <div style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; justify-content:center;">
    <button class="primary" id="start-vs-ai">VS AI (Beta)</button>
    <button id="start-pass-play">Pass &amp; Play (2 Players)</button>
  </div>
</div>

<div id="pass-overlay">
  <div class="display" id="pass-title">PASS TO PLAYER 2</div>
  <div class="mono" style="color:var(--muted); max-width:340px; text-align:center; font-size:0.8rem;">
    Player 1, look away. Hand the device to Player 2, then tap below to reveal their hand.
  </div>
  <button class="primary" id="pass-continue">I'm Ready — Show My Hand</button>
</div>

<div id="event-toast"></div>

<div id="choice-overlay">
  <div class="box">
    <div class="prompt" id="choice-prompt"></div>
    <div id="choice-buttons"></div>
  </div>
</div>

<div id="gameover-overlay">
  <div class="display result" id="gameover-result"></div>
  <div class="breakdown" id="gameover-breakdown"></div>
  <button class="primary" onclick="location.reload()">Play Again</button>
</div>

<script>
// =========================================================================
// CARD POOL — the 10-agent test roster
// =========================================================================
const CARD_POOL = [
  { id: 'fade',    name: 'Fade',    role: 'Initiator', cost: 1, power: 1,
    ability: 'On Reveal: peek at the top card of your deck.',
    onReveal: (ctx) => {
      const ownerColor = ctx.owner === state.players[0] ? 'var(--p1)' : 'var(--p2)';
      if (ctx.owner.isAI) {
        // This peeks at the AI's OWN deck — showing the actual card name
        // to the human would leak the AI's private information (unlike
        // Sova/Cypher, which reveal info about the OPPONENT's board/hand,
        // telling a human nothing they don't already know about themselves).
        announce(`<b>${ctx.owner.name}'s Fade</b> peeks at their own deck.`, ownerColor);
        return;
      }
      if (ctx.owner.deck.length > 0) {
        const peeked = ctx.owner.deck[0];
        announce(`<b>${ctx.owner.name}'s Fade</b> peeks: next draw will be <b>${peeked.name}</b>.`, ownerColor);
      } else {
        announce(`<b>${ctx.owner.name}'s Fade</b> peeks: deck is empty.`, ownerColor);
      }
    }
  },
  { id: 'breach',  name: 'Breach',  role: 'Initiator', cost: 1, power: 2,
    ability: 'On Reveal: opponent starts next round with -1 Cred.',
    onReveal: (ctx) => {
      ctx.opponent._credPenaltyNextRound = (ctx.opponent._credPenaltyNextRound || 0) + 1;
      announce(`<b>${ctx.owner.name}'s Breach</b> flashes — opponent gets -1 Cred next round.`, ctx.owner === state.players[0] ? 'var(--p1)' : 'var(--p2)');
    }
  },
  { id: 'sova',    name: 'Sova',    role: 'Initiator', cost: 2, power: 3,
    ability: "On Reveal: peek at a random card in opponent's hand.",
    onReveal: (ctx) => {
      const opp = ctx.opponent;
      if (opp.hand.length > 0) {
        const peeked = opp.hand[Math.floor(Math.random() * opp.hand.length)];
        announce(`<b>${ctx.owner.name}'s Sova</b> peeks: opponent holds <b>${peeked.name}</b> (${peeked.cost}c).`, ctx.owner === state.players[0] ? 'var(--p1)' : 'var(--p2)');
      } else {
        announce(`<b>${ctx.owner.name}'s Sova</b> reveals: opponent's hand is empty.`, ctx.owner === state.players[0] ? 'var(--p1)' : 'var(--p2)');
      }
    }
  },
  { id: 'omen',    name: 'Omen',    role: 'Controller', cost: 2, power: 3,
    ability: 'On Reveal: may move this card to another lane.',
    onReveal: (ctx) => maybeMove(ctx, 'Omen')
  },
  { id: 'cypher',  name: 'Cypher',  role: 'Sentinel', cost: 2, power: 2,
    ability: "On Reveal: see opponent's face-down cards in this lane.",
    onReveal: (ctx) => {
      const oppCards = ctx.opponent.board[ctx.laneIndex];
      const names = oppCards.length ? oppCards.map(c => c.name).join(', ') : '(none)';
      announce(`<b>${ctx.owner.name}'s Cypher</b> reveals opponent's cards here: <b>${names}</b>.`, ctx.owner === state.players[0] ? 'var(--p1)' : 'var(--p2)');
    }
  },
  { id: 'kayo',    name: 'KAY/O',   role: 'Initiator', cost: 2, power: 2,
    ability: "On Reveal: suppress one enemy On Reveal ability in this lane this round.",
    onReveal: (ctx) => {
      const oppCards = ctx.opponent.board[ctx.laneIndex].filter(c => c._justPlayed && !c._suppressed && !c._revealed);
      if (oppCards.length) {
        const target = oppCards[0];
        target._suppressed = true;
        announce(`<b>${ctx.owner.name}'s KAY/O</b> suppresses <b>${target.name}</b>'s ability.`, ctx.owner === state.players[0] ? 'var(--p1)' : 'var(--p2)');
      } else {
        announce(`<b>${ctx.owner.name}'s KAY/O</b> finds nothing new to suppress here.`, ctx.owner === state.players[0] ? 'var(--p1)' : 'var(--p2)');
      }
    }
  },
  { id: 'killjoy', name: 'Killjoy', role: 'Sentinel', cost: 3, power: 4,
    ability: 'On Reveal: reduce enemy Power in this lane by 2.',
    onReveal: (ctx) => {
      const oppCards = ctx.opponent.board[ctx.laneIndex];
      if (oppCards.length) {
        const target = oppCards[Math.floor(Math.random() * oppCards.length)];
        target.power = Math.max(0, target.power - 2);
        announce(`<b>${ctx.owner.name}'s Killjoy</b> zaps <b>${target.name}</b> for -2 Power.`, ctx.owner === state.players[0] ? 'var(--p1)' : 'var(--p2)');
      }
    }
  },
  { id: 'viper',   name: 'Viper',   role: 'Controller', cost: 3, power: 3,
    ability: 'Ongoing: all cards here (hers included) lose 1 Power.',
    ongoingLanePower: -1
  },
  { id: 'jett',    name: 'Jett',    role: 'Duelist', cost: 3, power: 3,
    ability: 'On Reveal: may move to an adjacent lane once.',
    onReveal: (ctx) => maybeMove(ctx, 'Jett')
  },
  { id: 'reyna',   name: 'Reyna',   role: 'Duelist', cost: 3, power: 2,
    ability: "On Reveal: if losing this lane, destroy the enemy's lowest card and gain +2 Power instead.",
    onReveal: (ctx) => {
      const myPower = lanePower(ctx.owner, ctx.laneIndex);
      const oppPower = lanePower(ctx.opponent, ctx.laneIndex);
      if (myPower < oppPower) {
        const oppCards = ctx.opponent.board[ctx.laneIndex];
        if (oppCards.length) {
          oppCards.sort((a,b) => a.power - b.power);
          const destroyed = oppCards.shift();
          ctx.card.power += 2;
          announce(`<b>${ctx.owner.name}'s Reyna</b> dominates: destroys <b>${destroyed.name}</b>, gains +2 Power.`, ctx.owner === state.players[0] ? 'var(--p1)' : 'var(--p2)');
        }
      } else {
        announce(`<b>${ctx.owner.name}'s Reyna</b> is already winning here — no trigger.`, ctx.owner === state.players[0] ? 'var(--p1)' : 'var(--p2)');
      }
    }
  },
  { id: 'sage',    name: 'Sage',    role: 'Sentinel', cost: 4, power: 3,
    ability: 'On Reveal: restore 2 Power to a friendly card in this lane.',
    onReveal: (ctx) => {
      const mine = ctx.owner.board[ctx.laneIndex].filter(c => c !== ctx.card);
      if (mine.length) {
        const target = mine[Math.floor(Math.random() * mine.length)];
        target.power += 2;
        announce(`<b>${ctx.owner.name}'s Sage</b> restores <b>${target.name}</b> for +2 Power.`, ctx.owner === state.players[0] ? 'var(--p1)' : 'var(--p2)');
      } else {
        announce(`<b>${ctx.owner.name}'s Sage</b> finds no ally to restore here.`, ctx.owner === state.players[0] ? 'var(--p1)' : 'var(--p2)');
      }
    }
  },
  { id: 'raze',    name: 'Raze',    role: 'Duelist', cost: 4, power: 5,
    ability: "On Reveal: deal -2 Power to the highest-Power enemy card in this lane.",
    onReveal: (ctx) => {
      const oppCards = ctx.opponent.board[ctx.laneIndex];
      if (oppCards.length) {
        oppCards.sort((a,b) => b.power - a.power);
        const target = oppCards[0];
        target.power = Math.max(0, target.power - 2);
        announce(`<b>${ctx.owner.name}'s Raze</b> blasts <b>${target.name}</b> for -2 Power.`, ctx.owner === state.players[0] ? 'var(--p1)' : 'var(--p2)');
      }
    }
  },
];

// =========================================================================
// SITE POOL — v1 ships with 3 clean numeric effects (movement/reveal-type
// site effects are on the roadmap once the core loop is validated)
// =========================================================================
const SITE_POOL = [
  { name: 'ASCENT', effect: 'The first card each player places here each round gets +2 Power.',
    onCardPlaced: (site, card, player, laneIndex) => {
      const alreadyPlacedThisRoundHere = player.board[laneIndex].some(c => c !== card && c._justPlayed);
      if (!alreadyPlacedThisRoundHere) {
        card.power += 2;
        card._ascentBonusApplied = true;
        announce(`<b>${player.name}'s ${card.name}</b> is first here this round — +2 Power (Ascent).`,
          player === state.players[0] ? 'var(--p1)' : 'var(--p2)');
      }
    },
    onCardRemoved: (site, card) => {
      if (card._ascentBonusApplied) { card.power -= 2; card._ascentBonusApplied = false; }
    }
  },
  { name: 'PEARL', effect: 'Cards played here cost 1 less.',
    costModifier: -1
  },
  { name: 'SUNSET', effect: 'A card gets +3 Power if it is the only card in this lane.',
    onRevealAll: (site, allCardsInLane) => {
      if (allCardsInLane.length === 1) allCardsInLane[0].power += 3;
    }
  },
];

// =========================================================================
// GAME STATE
// =========================================================================
const CRED_CURVE = [1, 2, 4, 6, 8, 9];

function shuffledDeck() {
  const deck = CARD_POOL.map(c => ({ ...c }));
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  return deck;
}

function makePlayer(name, isAI) {
  const deck = shuffledDeck();
  return {
    name,
    isAI: !!isAI,
    deck,
    hand: deck.splice(0, 3),
    cred: 0,
    board: [[], [], []],
  };
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let state = null;

function initGame(vsAI) {
  const sitesChosen = shuffleArray([...SITE_POOL]).slice(0, 3);
  state = {
    round: 1,
    vsAI: vsAI,
    sites: sitesChosen.map((s, i) => ({ ...s, revealed: i === 0 })),
    players: [makePlayer('Player 1', false), makePlayer(vsAI ? 'AI Opponent' : 'Player 2', vsAI)],
    activePlayerIndex: 0,
    selectedCardIndex: null,
    phase: 'placing',
  };
  document.getElementById('start-overlay').style.display = 'none';
  state.players.forEach(player => { player.cred = currentCredCap(); });
  log(`Match started. Sites this game: ${state.sites.map(s => s.name).join(', ')}.`);
  render();
}

document.getElementById('start-vs-ai').onclick = () => initGame(true);
document.getElementById('start-pass-play').onclick = () => initGame(false);

function cardChip(c, playerClass, clickable, laneIndex, cardIdx) {
  if (c._revealed) {
    return `<span class="mini-card ${playerClass}">${c.name} ${c.power}p</span>`;
  }
  if (clickable) {
    return `<span class="mini-card ${playerClass} clickable-chip" data-lane="${laneIndex}" data-cardidx="${cardIdx}" title="Click to take this back">FACE-DOWN ↩</span>`;
  }
  return `<span class="mini-card ${playerClass}">FACE-DOWN</span>`;
}

function lanePower(player, laneIndex) {
  return player.board[laneIndex].reduce((sum, c) => sum + c.power, 0)
    + (state.sites[laneIndex].ongoingLanePowerActive ? state.sites[laneIndex].ongoingLanePower * (player.board[laneIndex].length) : 0);
}

function log(msg) {
  const el = document.getElementById('log-entries');
  const line = document.createElement('div');
  line.innerHTML = `[R${state.round}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

let _toastTimer = null;
function showToast(msg, colorVar) {
  const toast = document.getElementById('event-toast');
  toast.innerHTML = msg;
  toast.style.borderColor = colorVar || 'var(--warn)';
  toast.classList.remove('show');
  void toast.offsetWidth; // force reflow so the animation restarts on rapid back-to-back reveals
  toast.classList.add('show');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}

function announce(msg, colorVar) {
  // For reveal/ability events specifically: shows an on-screen toast in
  // addition to the match log, since the log panel is easy to miss mid-game.
  log(msg);
  showToast(msg, colorVar);
}

// =========================================================================
// RENDERING
// =========================================================================
function render() {
  document.getElementById('round-num').textContent = state.round;
  document.getElementById('p1-cred').textContent = state.players[0].cred;
  document.getElementById('p2-cred').textContent = state.players[1].cred;

  // Turn banner
  const banner = document.getElementById('turn-banner');
  const active = state.players[state.activePlayerIndex];
  banner.className = state.activePlayerIndex === 0 ? 'p1' : 'p2';
  banner.textContent = `${active.name.toUpperCase()}'S TURN TO PLACE CARDS`;

  document.getElementById('actions').style.display = active.isAI ? 'none' : 'flex';

  // Sites
  const sitesEl = document.getElementById('sites');
  sitesEl.innerHTML = '';
  state.sites.forEach((site, idx) => {
    const div = document.createElement('div');
    if (!site.revealed) {
      div.className = 'site locked';
      div.textContent = `SITE ${idx + 1} — LOCKED UNTIL ROUND ${idx + 1}`;
      sitesEl.appendChild(div);
      return;
    }
    div.className = 'site';
    const p1Cards = state.players[0].board[idx];
    const p2Cards = state.players[1].board[idx];
    const p1Power = lanePower(state.players[0], idx);
    const p2Power = lanePower(state.players[1], idx);
    if (p1Power > p2Power) div.classList.add('won-p1');
    if (p2Power > p1Power) div.classList.add('won-p2');

    const active = state.players[state.activePlayerIndex];
    const p1Clickable = (active === state.players[0] && !active.isAI);
    const p2Clickable = (active === state.players[1] && !active.isAI);

    div.innerHTML = `
      <div class="site-head">
        <div class="name display">${site.name}</div>
        <div class="effect">${site.effect}</div>
      </div>
      <div class="site-body">
        <div class="lane-row">
          <div class="lane-label p1">Player 1</div>
          <div class="mini-cards">${p1Cards.map((c, ci) => cardChip(c, 'p1', p1Clickable, idx, ci)).join('') || '<span class="mono" style="color:var(--muted); font-size:0.7rem;">—</span>'}</div>
        </div>
        <div class="lane-row">
          <div class="lane-label p2">Player 2</div>
          <div class="mini-cards">${p2Cards.map((c, ci) => cardChip(c, 'p2', p2Clickable, idx, ci)).join('') || '<span class="mono" style="color:var(--muted); font-size:0.7rem;">—</span>'}</div>
        </div>
      </div>
      <div class="site-foot">
        <span class="power-tally p1">${p1Power}</span>
        <span class="power-tally p2">${p2Power}</span>
      </div>
    `;
    sitesEl.appendChild(div);
  });

  // Wire up "take back" clicks on the active player's own unrevealed cards.
  // stopPropagation matters here — these chips sit inside a Site div that
  // ALSO has its own click handler (for placing a newly selected card),
  // so without it, taking a card back would simultaneously re-trigger a
  // placement click on the same Site.
  document.querySelectorAll('.clickable-chip').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const laneIndex = parseInt(el.getAttribute('data-lane'), 10);
      const cardIdx = parseInt(el.getAttribute('data-cardidx'), 10);
      const player = state.players[state.activePlayerIndex];
      const card = player.board[laneIndex][cardIdx];
      if (card && removePlacement(player, laneIndex, card)) {
        log(`<b>${player.name}</b> takes back <b>${card.name}</b> from <b>${state.sites[laneIndex].name}</b>.`);
        render();
      }
    };
  });

  renderHand();
}

function currentCredCap() {
  return CRED_CURVE[state.round - 1];
}

function renderHand() {
  const player = state.players[state.activePlayerIndex];
  const handEl = document.getElementById('hand');

  if (player.isAI) {
    document.getElementById('hand-label').textContent = `${player.name.toUpperCase()} IS CHOOSING CARDS...`;
    handEl.innerHTML = `<div class="mono" style="color:var(--muted); font-size:0.8rem; padding:10px;">
      The AI's hand stays hidden — same as it would against a real opponent.
    </div>`;
    return;
  }

  document.getElementById('hand-label').textContent = `${player.name.toUpperCase()}'S HAND — ${player.cred} CRED AVAILABLE`;
  handEl.innerHTML = '';
  const revealedLanes = [0, 1, 2].filter(i => state.sites[i].revealed);
  player.hand.forEach((card, idx) => {
    // A card is affordable if it's playable in AT LEAST ONE currently
    // revealed lane — checking only the base cost ignored site discounts
    // like Pearl's -1, so e.g. a 3-cost card with 2 Cred was blocked from
    // even being selected, even though Pearl would make it a 2-cost play.
    const cheapestCost = Math.min(...revealedLanes.map(l =>
      Math.max(0, card.cost + (state.sites[l].costModifier || 0))));
    const canAfford = cheapestCost <= player.cred;

    const div = document.createElement('div');
    div.className = 'card';
    if (!canAfford) div.classList.add('unaffordable');
    if (state.selectedCardIndex === idx) div.classList.add('selected');
    div.innerHTML = `
      <div class="card-top"><span class="cost">${card.cost}c</span><span class="role">${card.role}</span></div>
      <div class="name display">${card.name}</div>
      <div class="power">⚡ ${card.power}</div>
      <div class="ability">${card.ability}</div>
    `;
    div.onclick = () => {
      if (!canAfford) return;
      state.selectedCardIndex = (state.selectedCardIndex === idx) ? null : idx;
      renderHand();
    };
    handEl.appendChild(div);
  });

  // Clicking a revealed site places the selected card there
  document.querySelectorAll('.site:not(.locked)').forEach((siteEl, idx) => {
    siteEl.style.cursor = state.selectedCardIndex !== null ? 'pointer' : 'default';
    siteEl.onclick = () => placeSelectedCard(idx);
  });
}

function applyPlacement(player, cardIndex, laneIndex) {
  const card = player.hand[cardIndex];
  const site = state.sites[laneIndex];
  const cost = Math.max(0, card.cost + (site.costModifier || 0));
  if (cost > player.cred) return false;

  player.cred -= cost;
  player.hand.splice(cardIndex, 1);
  card._justPlayed = true;
  card._revealed = false;
  card._suppressed = false;
  player.board[laneIndex].push(card);
  if (site.onCardPlaced) site.onCardPlaced(site, card, player, laneIndex);
  return true;
}

function removePlacement(player, laneIndex, card) {
  // Undo a placement made THIS turn (before it's been revealed) — refunds
  // the Cred spent and reverses any placement-time site bonus (e.g. Ascent)
  // so the board ends up exactly as if the card had never been placed.
  if (!card._justPlayed || card._revealed) return false;
  const idx = player.board[laneIndex].indexOf(card);
  if (idx === -1) return false;

  const site = state.sites[laneIndex];
  if (site.onCardRemoved) site.onCardRemoved(site, card, player, laneIndex);
  player.board[laneIndex].splice(idx, 1);

  const cost = Math.max(0, card.cost + (site.costModifier || 0));
  player.cred += cost;
  card._justPlayed = false;
  player.hand.push(card);
  return true;
}

function placeSelectedCard(laneIndex) {
  if (state.selectedCardIndex === null) return;
  const player = state.players[state.activePlayerIndex];
  const card = player.hand[state.selectedCardIndex];
  const site = state.sites[laneIndex];
  const cost = Math.max(0, card.cost + (site.costModifier || 0));
  if (cost > player.cred) { log(`Not enough Cred to place <b>${card.name}</b> here.`); return; }

  applyPlacement(player, state.selectedCardIndex, laneIndex);
  log(`<b>${player.name}</b> places <b>${card.name}</b> in <b>${site.name}</b>.`);
  state.selectedCardIndex = null;
  render();
}

// =========================================================================
// TURN / ROUND FLOW
// =========================================================================
document.getElementById('btn-clear').onclick = () => { state.selectedCardIndex = null; renderHand(); };

document.getElementById('btn-done').onclick = () => {
  if (state.activePlayerIndex === 0) {
    state.activePlayerIndex = 1;
    if (state.vsAI) {
      render();
      runAITurn();
    } else {
      showPassOverlay('PASS TO PLAYER 2');
    }
  } else {
    resolveReveal();
  }
};

async function runAITurn() {
  const ai = state.players[1];
  const human = state.players[0];
  document.getElementById('btn-done').disabled = true;
  log(`<b>${ai.name}</b> is planning their placements...`);
  await sleep(500);

  // Greedy heuristic: repeatedly find the revealed Site where the AI is
  // currently furthest behind, and commit its strongest still-affordable
  // card there. Not a lookahead/search — just a competent, readable bot
  // for v1 playtesting.
  let keepGoing = true;
  while (keepGoing) {
    const revealedLanes = [0, 1, 2].filter(i => state.sites[i].revealed);
    const affordableIdxs = ai.hand
      .map((c, idx) => idx)
      .filter(idx => {
        // cheapest possible placement across revealed lanes, accounting for site cost modifiers
        const cheapestCost = Math.min(...revealedLanes.map(l =>
          Math.max(0, ai.hand[idx].cost + (state.sites[l].costModifier || 0))));
        return cheapestCost <= ai.cred;
      });

    if (affordableIdxs.length === 0) { keepGoing = false; break; }

    // Target lane = biggest current deficit (opponent power - AI power)
    const laneDeficits = revealedLanes.map(l => ({
      lane: l,
      deficit: lanePower(human, l) - lanePower(ai, l),
    })).sort((a, b) => b.deficit - a.deficit);
    const targetLane = laneDeficits[0].lane;

    // Best card = highest Power among affordable-for-this-lane cards
    const candidates = affordableIdxs
      .map(idx => ({ idx, cost: Math.max(0, ai.hand[idx].cost + (state.sites[targetLane].costModifier || 0)) }))
      .filter(c => c.cost <= ai.cred)
      .sort((a, b) => ai.hand[b.idx].power - ai.hand[a.idx].power);

    if (candidates.length === 0) { keepGoing = false; break; }

    const chosen = candidates[0];
    const card = ai.hand[chosen.idx];
    applyPlacement(ai, chosen.idx, targetLane);
    log(`<b>${ai.name}</b> places a card in <b>${state.sites[targetLane].name}</b>.`);
    render();
    await sleep(450);
  }

  log(`<b>${ai.name}</b> is done placing.`);
  document.getElementById('btn-done').disabled = false;
  await sleep(300);
  resolveReveal();
}

function showPassOverlay(title) {
  document.getElementById('pass-title').textContent = title;
  document.getElementById('pass-overlay').style.display = 'flex';
}
document.getElementById('pass-continue').onclick = () => {
  document.getElementById('pass-overlay').style.display = 'none';
  render();
};

function maybeMove(ctx, agentName) {
  const otherLanes = [0, 1, 2].filter(i => i !== ctx.laneIndex && state.sites[i].revealed);
  if (!otherLanes.length) { announce(`<b>${ctx.owner.name}'s ${agentName}</b> has nowhere to move.`, ctx.owner === state.players[0] ? 'var(--p1)' : 'var(--p2)'); return Promise.resolve(); }

  if (ctx.owner.isAI) {
    // Simple heuristic: move only if it would flip a lane the AI is
    // currently losing into a lane it's winning or closer to winning.
    // No UI needed — this is a bot decision, not a human prompt.
    const currentDeficit = lanePower(ctx.opponent, ctx.laneIndex) - lanePower(ctx.owner, ctx.laneIndex);
    let bestLane = null, bestDeficit = currentDeficit;
    otherLanes.forEach(i => {
      const deficitThere = lanePower(ctx.opponent, i) - (lanePower(ctx.owner, i) + ctx.card.power);
      if (deficitThere < bestDeficit) { bestDeficit = deficitThere; bestLane = i; }
    });
    if (bestLane !== null) {
      const idx = ctx.owner.board[ctx.laneIndex].indexOf(ctx.card);
      ctx.owner.board[ctx.laneIndex].splice(idx, 1);
      ctx.owner.board[bestLane].push(ctx.card);
      announce(`<b>${ctx.owner.name}'s ${agentName}</b> moves to <b>${state.sites[bestLane].name}</b>.`, ctx.owner === state.players[0] ? 'var(--p1)' : 'var(--p2)');
    } else {
      announce(`<b>${ctx.owner.name}'s ${agentName}</b> stays put.`, ctx.owner === state.players[0] ? 'var(--p1)' : 'var(--p2)');
    }
    return Promise.resolve();
  }

  return new Promise((resolve) => {
    const overlay = document.getElementById('choice-overlay');
    document.getElementById('choice-prompt').innerHTML = `<b>${ctx.owner.name}'s ${agentName}</b> may move to another lane. Choose:`;
    const btns = document.getElementById('choice-buttons');
    btns.innerHTML = '';
    const stay = document.createElement('button');
    stay.textContent = 'Stay Here';
    stay.onclick = () => { overlay.style.display = 'none'; resolve(); };
    btns.appendChild(stay);
    otherLanes.forEach(i => {
      const b = document.createElement('button');
      b.textContent = `Move to ${state.sites[i].name}`;
      b.className = 'primary';
      b.onclick = () => {
        const idx = ctx.owner.board[ctx.laneIndex].indexOf(ctx.card);
        ctx.owner.board[ctx.laneIndex].splice(idx, 1);
        ctx.owner.board[i].push(ctx.card);
        announce(`<b>${ctx.owner.name}'s ${agentName}</b> moves to <b>${state.sites[i].name}</b>.`, ctx.owner === state.players[0] ? 'var(--p1)' : 'var(--p2)');
        overlay.style.display = 'none';
        resolve();
      };
      btns.appendChild(b);
    });
    overlay.style.display = 'flex';
  });
}

async function resolveReveal() {
  log(`— Reveal Phase —`);
  // Gather all newly-placed cards across both players/lanes
  const pending = [];
  state.players.forEach((player, pIdx) => {
    player.board.forEach((laneCards, laneIdx) => {
      laneCards.forEach(card => {
        if (card._justPlayed) pending.push({ card, owner: player, opponent: state.players[1 - pIdx], laneIndex: laneIdx });
      });
    });
  });

  // Shuffle FIRST, then stable-sort by cost ascending. Player 1 always
  // places cards before Player 2/AI in our turn structure, which meant
  // equal-cost cards would always resolve in Player 1's favor (their
  // cards get pushed into this array first, and Array.sort is stable).
  // Shuffling before the sort gives tied costs a genuinely fair random
  // order instead of a hidden structural bias toward whoever moved first.
  for (let i = pending.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pending[i], pending[j]] = [pending[j], pending[i]];
  }
  pending.sort((a, b) => a.card.cost - b.card.cost);

  for (const ctx of pending) {
    const ownerColor = ctx.owner === state.players[0] ? 'var(--p1)' : 'var(--p2)';
    if (ctx.card._suppressed) {
      announce(`<b>${ctx.owner.name}'s ${ctx.card.name}</b> reveals — ability suppressed.`, ownerColor);
    } else if (ctx.card.onReveal) {
      await ctx.card.onReveal(ctx);
    } else {
      announce(`<b>${ctx.owner.name}'s ${ctx.card.name}</b> reveals in ${state.sites[ctx.laneIndex].name}.`, ownerColor);
    }
    ctx.card._revealed = true;
    ctx.card._justPlayed = false;
    render();
    await sleep(2400); // lets each toast + the updated board be actually read before the next reveal fires
  }

  // Apply Ongoing lane-power effects (e.g. Viper) as active flags for scoring
  state.sites.forEach((site, laneIdx) => {
    const hasViperLikeCard = [0, 1].some(pIdx => state.players[pIdx].board[laneIdx].some(c => c.ongoingLanePower));
    site.ongoingLanePowerActive = false;
    site.ongoingLanePower = 0;
    [0, 1].forEach(pIdx => {
      state.players[pIdx].board[laneIdx].forEach(c => {
        if (c.ongoingLanePower) { site.ongoingLanePowerActive = true; site.ongoingLanePower = c.ongoingLanePower; }
      });
    });
    // Sunset-style "only card in lane" check, applied per player's own card set
    if (site.onRevealAll) {
      [0, 1].forEach(pIdx => site.onRevealAll(site, state.players[pIdx].board[laneIdx]));
    }
  });

  // Plant-pulse animation on whichever sites are currently controlled
  document.querySelectorAll('.site:not(.locked)').forEach((siteEl, idx) => {
    const p1p = lanePower(state.players[0], idx);
    const p2p = lanePower(state.players[1], idx);
    if (p1p === p2p) return;
    const pulse = document.createElement('div');
    pulse.className = 'plant-pulse ' + (p1p > p2p ? 'p1' : 'p2');
    siteEl.appendChild(pulse);
    setTimeout(() => pulse.remove(), 900);
  });

  render();
  await sleep(400);
  advanceRound();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function advanceRound() {
  if (state.round >= 6) { endGame(); return; }

  state.round += 1;
  document.getElementById('btn-done').textContent = 'Done Placing — Pass Device';

  // Reveal next site if applicable
  if (state.round - 1 < state.sites.length) {
    const nextSite = state.sites[state.round - 1];
    if (nextSite && !nextSite.revealed) {
      nextSite.revealed = true;
      log(`<b>${nextSite.name}</b> is revealed!`);
    }
  }

  // New cred cap each round, reduced by any pending Breach penalty
  state.players.forEach(player => {
    let cap = currentCredCap();
    if (player._credPenaltyNextRound) {
      cap = Math.max(0, cap - player._credPenaltyNextRound);
      log(`<b>${player.name}</b> starts Round ${state.round} with -${player._credPenaltyNextRound} Cred (Breach).`);
      player._credPenaltyNextRound = 0;
    }
    player.cred = cap;
    if (player.deck.length) player.hand.push(player.deck.shift());
  });

  state.activePlayerIndex = 0;
  log(`— Round ${state.round} begins —`);
  if (state.vsAI) {
    render();
  } else {
    showPassOverlay('PASS TO PLAYER 1');
  }
}

function endGame() {
  let p1Sites = 0, p2Sites = 0;
  state.sites.forEach((site, idx) => {
    const p1p = lanePower(state.players[0], idx);
    const p2p = lanePower(state.players[1], idx);
    if (p1p > p2p) p1Sites++; else if (p2p > p1p) p2Sites++;
  });

  const overlay = document.getElementById('gameover-overlay');
  const resultEl = document.getElementById('gameover-result');
  if (p1Sites > p2Sites) { resultEl.textContent = 'PLAYER 1 WINS'; resultEl.style.color = 'var(--p1)'; }
  else if (p2Sites > p1Sites) { resultEl.textContent = 'PLAYER 2 WINS'; resultEl.style.color = 'var(--p2)'; }
  else { resultEl.textContent = 'DRAW'; resultEl.style.color = 'var(--warn)'; }

  document.getElementById('gameover-breakdown').innerHTML =
    `Sites won — Player 1: ${p1Sites} · Player 2: ${p2Sites}`;
  overlay.style.display = 'flex';
}

// Game starts once the player picks a mode on the start screen (see initGame above).
</script>

</body>
